<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Meistgenutzte Sprachen">
<title>Meistgenutzte Sprachen</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#141a33"/><stop offset="1" stop-color="#0b0f1e"/>
  </linearGradient>
  <clipPath id="bar"><rect x="470" y="110" width="690" height="14" rx="7"/></clipPath>
</defs>
<style>
  .num { font: 800 40px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #e6e9f5; }
  .lbl { font: 500 14px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; fill: #8b93b8; }
  .title { font: 700 20px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #e6e9f5; }
  .note { font: 400 13px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; fill: #8b93b8; }
  .lang { font: 600 16px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #e6e9f5; }
  .pct { font-weight: 400; fill: #8b93b8; }
  .grow { animation: grow 1.2s cubic-bezier(.2,.8,.2,1) both; transform-origin: 470px 0; }
  @keyframes grow { from { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { .grow { animation: none; } }
</style>
<rect width="1200" height="300" rx="16" fill="url(#bg)"/>
<rect x=".5" y=".5" width="1199" height="299" rx="16" fill="none" stroke="#7aa2f7" stroke-opacity="0.18"/>
<text x="56" y="84" class="num">13</text><text x="56" y="108" class="lbl">öffentliche Repos</text><text x="56" y="162" class="num">4</text><text x="56" y="186" class="lbl">Sterne</text><text x="56" y="240" class="num">16</text><text x="56" y="264" class="lbl">Follower</text>
<path d="M390 40V260" stroke="#8b93b8" stroke-opacity="0.25"/>
<text x="470" y="70" class="title">Meistgenutzte Sprachen</text>
<text x="470" y="92" class="note">basierend auf dem Code meiner öffentlichen Repos</text>
